      Diving Deeper:
        - diving-deeper/**.md
      Tutorials - Docs:
        - tutorials/**.md
      Tutorials - Notebooks:
        - tutorials/**.ipynb
      Community:
        - community/**.md
      FAQ:
        - faqs.md: Common questions on DSPy usage, comparisons, optimization, and debugging
        - cheatsheet.md: DSPy cheatsheet for quick reference
