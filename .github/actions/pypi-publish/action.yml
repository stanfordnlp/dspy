name: Publish Python distributions (temporary patched upstream)
description: Upstream PyPA publisher with a temporary pip security overlay.
inputs:
  user:
    description: PyPI user
    default: __token__
  password:
    description: API token (omit for Trusted Publishing)
  repository-url:
    description: Package index upload URL
    default: https://upload.pypi.org/legacy/
  packages-dir:
    description: Directory containing distributions
    default: dist
  verify-metadata:
    description: Check metadata before uploading
    default: 'true'
  skip-existing:
    description: Skip distributions already present on the index
    default: 'false'
  verbose:
    description: Show verbose output
    default: 'true'
  print-hash:
    description: Show distribution hashes
    default: 'true'
  attestations:
    description: Generate PEP 740 attestations with Trusted Publishing
    default: 'true'
runs:
  using: docker
  image: Dockerfile
