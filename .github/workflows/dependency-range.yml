name: Dependency Range

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/dependency-range.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-range:
    name: Dependencies (${{ matrix.profile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum-direct
            resolution: lowest-direct
          - profile: latest
            resolution: highest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Create environment
        run: uv venv .venv

      - name: Resolve ${{ matrix.profile }} dependencies
        env:
          PROFILE: ${{ matrix.profile }}
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          uv pip compile pyproject.toml \
            --extra deno \
            --extra dev \
            --extra test_extras \
            --resolution "$RESOLUTION" \
            --python .venv/bin/python \
            --refresh \
            --no-sources \
            --output-file "$RUNNER_TEMP/requirements-$PROFILE.txt"

          uv pip sync \
            --strict \
            --python .venv/bin/python \
            "$RUNNER_TEMP/requirements-$PROFILE.txt"

          uv pip install \
            --python .venv/bin/python \
            --no-deps \
            --editable .

          uv pip check --python .venv/bin/python
          uv pip list --python .venv/bin/python
          uv run --frozen --no-sync --python .venv/bin/python python -c \
            'import deno, subprocess; subprocess.run([deno.find_deno_bin(), "--version"], check=True)'

      - name: Run non-live tests
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set +e
          uv run --frozen --no-sync pytest -q -n auto --dist worksteal tests/ --extra --deno 2>&1 \
            | tee "$RUNNER_TEMP/pytest-$PROFILE.log"
          TEST_STATUS=${PIPESTATUS[0]}
          set -e

          {
            echo "## Dependencies ($PROFILE)"
            echo
            if [ "$TEST_STATUS" -eq 0 ]; then
              echo "✅ Non-live test suite passed."
            else
              echo "❌ Non-live test suite failed."
              echo
              echo '```text'
              if ! grep -E '^(FAILED|ERROR) |[0-9]+ failed, [0-9]+ passed' "$RUNNER_TEMP/pytest-$PROFILE.log"; then
                tail -n 20 "$RUNNER_TEMP/pytest-$PROFILE.log"
              fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$TEST_STATUS"
